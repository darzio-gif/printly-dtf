<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#070707" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/logo.png" type="image/png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <link rel="stylesheet" href="/activity.css" />
    <title>Printly — DTF / UV Order Manager</title>
    <style>
      html,body{margin:0;background:#070707}
      #printly-splash{position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;background:#070707;transition:opacity .45s ease,visibility .45s ease}
      #printly-splash.hide{opacity:0;visibility:hidden;pointer-events:none}
      .splash-inner{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;animation:splashIn .7s cubic-bezier(.22,1,.36,1)}
      .splash-logo{width:112px;height:112px;border-radius:28px;object-fit:cover;box-shadow:0 0 0 1px rgba(255,255,255,.08),0 18px 55px rgba(239,11,25,.28)}
      .splash-name{font:800 25px/1 Arial,sans-serif;letter-spacing:3px;color:#fff}
      .splash-line{width:42px;height:3px;border-radius:99px;background:#ef0b19;animation:splashPulse 1.1s ease-in-out infinite}
      @keyframes splashIn{from{opacity:0;transform:scale(.9) translateY(10px)}to{opacity:1;transform:none}}
      @keyframes splashPulse{0%,100%{transform:scaleX(.65);opacity:.45}50%{transform:scaleX(1);opacity:1}}
      @media(min-width:768px){.splash-logo{width:128px;height:128px;border-radius:32px}.splash-name{font-size:28px}}
      @media(prefers-reduced-motion:reduce){#printly-splash,.splash-inner{animation:none;transition:none}.splash-line{animation:none}}
    </style>
  </head>
  <body>
    <div id="printly-splash" aria-label="PRINTLY">
      <div class="splash-inner">
        <img class="splash-logo" src="/logo.png" alt="PRINTLY" />
        <div class="splash-name">PRINTLY</div>
        <div class="splash-line"></div>
      </div>
    </div>

    <div id="root"></div>

    <script>
      (function(){
        function hideSplash(){
          var splash=document.getElementById('printly-splash');
          if(!splash)return;
          setTimeout(function(){splash.classList.add('hide');setTimeout(function(){splash.remove()},500)},650);
        }
        if(document.readyState==='complete') hideSplash();
        else window.addEventListener('load',hideSplash,{once:true});
        setTimeout(hideSplash,4000);
      })();
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js'));
      }
    </script>
    <script type="module" src="/main.jsx"></script>
  </body>
</html>
